<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JBS DigitalPRO</title>
  </head>
  <body>
    <main>
      <section id="contato" aria-labelledby="contato-title">
        <h2 id="contato-title">Fale com a JBS DigitalPRO</h2>

        <form id="contact-form" novalidate>
          <div>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required />
          </div>

          <div>
            <label for="empresa">Empresa</label>
            <input id="empresa" name="empresa" type="text" required />
          </div>

          <div>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required />
          </div>

          <div>
            <label for="whatsapp">WhatsApp</label>
            <input
              id="whatsapp"
              name="whatsapp"
              type="tel"
              placeholder="+55 11 99999-9999"
              required
            />
          </div>

          <div>
            <label for="servico_interesse">Serviço de interesse</label>
            <select id="servico_interesse" name="servico_interesse" required>
              <option value="" selected disabled>Selecione</option>
              <option value="consultoria">Consultoria</option>
              <option value="implantacao">Implantação</option>
              <option value="suporte">Suporte</option>
              <option value="integracao">Integração</option>
            </select>
          </div>

          <div>
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
          </div>

          <input type="hidden" name="lead_source" value="site_jbsdigitalpro" />
          <input type="hidden" id="form_type" name="form_type" value="contato" />

          <button type="submit">Enviar</button>
          <p id="form-feedback" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
