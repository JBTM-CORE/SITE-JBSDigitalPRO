<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JBS Digital Pro</title>
</head>
<body>
  <main>
    <section id="contato" aria-labelledby="contato-title">
      <h2 id="contato-title">Fale com a JBS Digital Pro</h2>

      <form id="lead-form" novalidate>
        <div>
          <label for="name">Nome completo*</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>

        <div>
          <label for="email">E-mail corporativo*</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <div>
          <label for="company">Empresa*</label>
          <input type="text" id="company" name="company" autocomplete="organization" required />
        </div>

        <div>
          <label for="whatsapp">WhatsApp*</label>
          <input
            type="tel"
            id="whatsapp"
            name="whatsapp"
            inputmode="tel"
            placeholder="(11) 99999-9999"
            required
          />
        </div>

        <div>
          <label for="service_interest">Serviço de interesse*</label>
          <select id="service_interest" name="service_interest" required>
            <option value="">Selecione um serviço</option>
            <option value="sites">Sites institucionais</option>
            <option value="ecommerce">E-commerce</option>
            <option value="trafego_pago">Tráfego pago</option>
            <option value="seo">SEO</option>
            <option value="automacao">Automação e integrações</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div>
          <label for="estimated_budget">Orçamento aproximado*</label>
          <select id="estimated_budget" name="estimated_budget" required>
            <option value="">Selecione uma faixa</option>
            <option value="ate_5k">Até R$ 5 mil</option>
            <option value="5k_15k">R$ 5 mil a R$ 15 mil</option>
            <option value="15k_30k">R$ 15 mil a R$ 30 mil</option>
            <option value="30k_plus">Acima de R$ 30 mil</option>
          </select>
        </div>

        <div>
          <label for="message">Contexto do projeto*</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <input type="hidden" id="source_page" name="source_page" value="" />
        <input type="hidden" id="lead_source" name="lead_source" value="site_jbsdigitalpro" />

        <button type="submit">Enviar</button>
      </form>

      <p id="form-feedback" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
