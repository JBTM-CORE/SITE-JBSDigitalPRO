<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JBS Digital Pro</title>
    <meta
      name="description"
      content="JBS Digital Pro: soluções digitais com identidade visual oficial da marca."
    />
    <meta name="theme-color" content="#0F4C81" />
    <meta property="og:title" content="JBS Digital Pro" />
    <meta
      property="og:description"
      content="Transformação digital com foco em performance, automação e crescimento."
    />
    <meta property="og:image" content="assets/img/logo-social.svg" />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="JBS Digital Pro - Página inicial">
        <img
          src="assets/img/logo-light.svg"
          alt="JBS Digital Pro"
          class="brand-logo brand-logo--light"
          width="180"
          height="44"
        />
        <img
          src="assets/img/logo-dark.svg"
          alt="JBS Digital Pro"
          class="brand-logo brand-logo--dark"
          width="180"
          height="44"
        />
      </a>

      <nav class="main-nav" aria-label="Navegação principal">
        <a href="#servicos">Serviços</a>
        <a href="#cases">Cases</a>
        <a href="#contato">Contato</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="servicos">
        <p class="eyebrow">Identidade oficial aplicada</p>
        <h1>Soluções digitais orientadas por dados e resultados</h1>
        <p>
          Reforçamos a presença da marca com experiência consistente em todos os
          pontos de contato.
        </p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#contato">Falar com especialista</a>
          <a class="btn btn-secondary" href="#cases">Ver cases</a>
        </div>
      </section>
    </main>
  </body>
</html>
